<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
    <style>
      body {
        background: #000;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      h1 {
        color: aliceblue;
        display: flex;
        justify-content: center;
        margin-top: -10px;
      }
      label {
        color: rgb(229, 232, 234);
      }

      .forms {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 500px;
      }
      .container{
        background: rgb(75, 75, 75);
        padding: 40px;
        border-radius: 2dvh;
        box-shadow: 10px 10px 10px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap:5px;
    }

      input {
        margin-bottom: 15px;
        padding: 10px;
        border: none;
        border-radius: 5px;
      }
      button {
        background: rgb(19, 19, 150);
        border: none;
        color: white;
        padding: 8px;
        border-radius: 10px;
        font-size: medium;
        font-weight: 300;
        height:50px;
        margin-top: 10px;
      }

      button:hover {
        background: #000;
      }
      .grid-item {
        background-color: #cfe8dc;
        border: 2px solid #4fb9e3;
        padding: 20px;
        text-align: center;
      }
      .form1 select{
        width: 100%;
        height: 40px;
        padding: 5px;
        font-size: 15px;
        border-radius: 5px;
      }
      a{
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
        <a href="index.html">Back to login</a>
        <h1>Register</h1>
        <div class="forms">
          <div class="form">
             <label>First Name</label>
              <input type="text" />
          </div>
 
        <div class="form">
          <label>Last Name</label>
          <input type="text" />
        </div>

        <div class="form">
          <label>Email</label>
          <input type="email" />
        </div>

        <div class="form">
          <label>Phone</label>
          <input type="tel" />
        </div>

        <div class="form1">
            <label>Gender</label>
            <select>
                 <option value="">Select Gender</option>
                 <option value="male">Male</option>
                 <option value="female">Female</option>
            </select>
        </div>

        <button type="button">Submit</button>
        
        </div>
        
    </div>
  </body>
</html>
